services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - env/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"


  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - env/api.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const req = require('http').get('http://127.0.0.1:3000/diagrams', (res) => process.exit(res.statusCode ? 0 : 1)); req.on('error', () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: