services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chartdb
      POSTGRES_PASSWORD: chartdb
      POSTGRES_DB: chartdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: chartdb
      DB_PASSWORD: chartdb
      DB_NAME: chartdb
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: