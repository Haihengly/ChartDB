services:
  postgres:
    image: postgres:15-alpine
    env_file:
      - env/postgres.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chartdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - env/api.env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data: